# ==============================================================================
# GHAZAL COSMETICS & ERP - NETLIFY PRODUCTION DEPLOYMENT CONFIGURATION
# Optimized for Next.js 16 (App Router + Turbopack + Node.js 22 Runtime)
# ==============================================================================

[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  # Disable strict repo-string matching scanner to prevent false positive exits
  SECRETS_SCAN_ENABLED = "false"
  SECRETS_SCAN_OMIT_KEYS = "BACKUP_EMAIL_FROM,RESEND_ORDER_NOTIFICATION_EMAIL,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY,DATABASE_URL,DIRECT_URL,SUPABASE_BACKUP_URL,NEON_BACKUP_URL,RESEND_API_KEY,SESSION_SECRET"

# Next.js Official Runtime Plugin for Netlify
[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  included_files = ["prisma/schema.prisma"]

# Static Asset Caching & Security Headers
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
