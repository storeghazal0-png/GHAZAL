name: Ghazal Automated Weekly Data Retention & Storage Cleanup

on:
  schedule:
    # 02:00 AM Asia/Amman = 23:00 UTC Saturday (Jordan permanently observes UTC+3) every Sunday
    - cron: '0 23 * * 6'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual data retention trigger reason'
        required: false
        default: 'Admin on-demand data retention cycle'

concurrency:
  group: ghazal-data-retention
  cancel-in-progress: false

jobs:
  run-retention:
    name: Automatic 90-Day Invoices & System Logs Retention
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Data Retention Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.DIRECT_URL || secrets.SUPABASE_BACKUP_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || secrets.SUPABASE_BACKUP_URL }}
        run: |
          npx tsx scripts/run-retention.ts
