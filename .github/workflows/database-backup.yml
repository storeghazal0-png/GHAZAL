name: Ghazal Automated Safe Database Backup & Neon Disaster Recovery

on:
  schedule:
    # 03:17 AM Asia/Amman = 00:17 UTC (Jordan permanently observes UTC+3) every Friday
    - cron: '17 0 * * 5'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual backup trigger reason'
        required: false
        default: 'Admin on-demand disaster recovery backup'

concurrency:
  group: ghazal-database-backup
  cancel-in-progress: false

jobs:
  backup-and-rotate:
    name: Safe Backup Rotation to Neon
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL 16 Client Utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client

      - name: Run Safe Backup Orchestrator
        env:
          SUPABASE_BACKUP_URL: ${{ secrets.SUPABASE_BACKUP_URL || secrets.DIRECT_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_BACKUP_URL: ${{ secrets.NEON_BACKUP_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BACKUP_EMAIL_TO: ${{ secrets.BACKUP_EMAIL_TO || 'storeghazal0@gmail.com' }}
          BACKUP_EMAIL_FROM: ${{ secrets.BACKUP_EMAIL_FROM || 'onboarding@resend.dev' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          npx tsx scripts/backup-orchestrator.ts
